      if(pcSet.indexOf(pc)===-1) pcSet.push(pc);
    });

    const match = detectChord(pcSet, bassPc);
    const label = formatChordLabel(match);
    if(label){
      chordNameEl.textContent = label;
    } else {
      chordNameEl.textContent = pcSet.join(', ');
    }

    // degrees are measured from the chord's root when one was found, otherwise from the bass note
    const degreeRoot = match ? match.root : bassPc;
    chordNotesEl.innerHTML = '';
    markedStrings.forEach(s=>{
      const pc = pitchAt(s, marks[s]);
      const chip = document.createElement('span');
      chip.className = 'note-chip';
      chip.style.background = PITCH_COLORS[pc].fill;
      chip.textContent = `${degreeOf(pc, degreeRoot)} ${SOLFEGE[pc]}(${pc})`;
      chordNotesEl.appendChild(chip);
    });
  }

  // ---------- rendering (fixed 6-string guitar fretboard, same visual style as the note tool) ----------
  const NUT_X = 150, FRET_W = 62, TOP_MARGIN = 80, STRING_GAP = 34, RIGHT_PAD = 24;
  const OPEN_X = NUT_X, HEAD_TIP_X = 16, HEAD_FLARE = 26, PEG_POST_LEN = 20, PEG_R = 6;
  const SCALE_LEN = 12*FRET_W*2;
  const BODY_WIDEN = 1.2;

  function fretWireX(fret){
    return fret===0 ? NUT_X : NUT_X + SCALE_LEN*(1 - Math.pow(2, -fret/12));
  }
  function cellCenterX(fret){
    return fret===0 ? OPEN_X : (fretWireX(fret-1)+fretWireX(fret))/2;
  }
  function svgEl(tag, attrs){
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for(const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  function gradientStops(el, stops){
    stops.forEach(([off,color])=>{
      el.appendChild(svgEl('stop', { offset:`${off}%`, 'stop-color':color }));
    });
    return el;
  }

  function render(){
    updateChordDisplay();

    svg.innerHTML = '';
    const n = N;
    const neckTop = TOP_MARGIN - 16;
    const neckBottom = TOP_MARGIN + (n-1)*STRING_GAP + 16;
    const topHeadY = neckTop - HEAD_FLARE;
    const bottomHeadY = neckBottom + HEAD_FLARE;
    const CAP_R = 16;
    const width = NUT_X + 12*FRET_W + RIGHT_PAD;
    const RIGHT_EDGE = width - RIGHT_PAD;

    const centerY = TOP_MARGIN + (n-1)*STRING_GAP/2;
    const nutHalf = (n-1)*STRING_GAP/2;
    const bodyHalf = nutHalf*BODY_WIDEN;
    function halfWidthAt(x){
      const t = Math.max(0, Math.min(1, (x-NUT_X)/(RIGHT_EDGE-NUT_X)));
      return nutHalf + (bodyHalf-nutHalf)*t;
    }
    function topYAt(x){ return centerY - (halfWidthAt(x)+16); }
    function bottomYAt(x){ return centerY + (halfWidthAt(x)+16); }
    function stringYAt(row, x){
      const norm = (row-(n-1)/2)/((n-1)/2);
      return centerY + norm*halfWidthAt(x);
    }

    const narrow = window.matchMedia('(max-width: 600px)').matches;
    const height = Math.max(bottomHeadY, bottomYAt(RIGHT_EDGE)+40);
    if(narrow){
      // スマホ幅ではヘッド・ペグを隠し、指板を画面いっぱいに表示
      const vx = NUT_X - 18;
      const vy = Math.min(neckTop, topYAt(RIGHT_EDGE)) - 12;
      svg.setAttribute('viewBox', `${vx} ${vy} ${width-vx} ${bottomYAt(RIGHT_EDGE)+36-vy}`);
    }else{
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    }

    const defs = svgEl('defs', {});
    defs.appendChild(gradientStops(svgEl('linearGradient', { id:'chordWoodGrad', x1:'0%', y1:'0%', x2:'100%', y2:'0%' }), [
      [0,'#e7c785'], [22,'#d9b06a'], [48,'#ecce90'], [72,'#d3a862'], [100,'#e7c785']
    ]));
    defs.appendChild(gradientStops(svgEl('radialGradient', { id:'chordPegGrad', cx:'35%', cy:'32%', r:'70%' }), [
      [0,'#f6f6f6'], [55,'#b9b9bd'], [100,'#57575b']
    ]));
    svg.appendChild(defs);

    const headPath = `M ${NUT_X} ${neckTop} `
      + `L ${HEAD_TIP_X+CAP_R} ${topHeadY} `
      + `A ${CAP_R} ${CAP_R} 0 0 0 ${HEAD_TIP_X} ${topHeadY+CAP_R} `
      + `L ${HEAD_TIP_X} ${bottomHeadY-CAP_R} `
      + `A ${CAP_R} ${CAP_R} 0 0 0 ${HEAD_TIP_X+CAP_R} ${bottomHeadY} `
      + `L ${NUT_X} ${neckBottom} Z`;
    if(!narrow) svg.appendChild(svgEl('path', { d:headPath, fill:'url(#chordWoodGrad)', stroke:'#7a5a30', 'stroke-width':1.5 }));

    const neckPath = `M ${NUT_X} ${topYAt(NUT_X)} L ${RIGHT_EDGE} ${topYAt(RIGHT_EDGE)} `
      + `L ${RIGHT_EDGE} ${bottomYAt(RIGHT_EDGE)} L ${NUT_X} ${bottomYAt(NUT_X)} Z`;
    svg.appendChild(svgEl('path', { d:neckPath, fill:'url(#chordWoodGrad)', stroke:'#7a5a30', 'stroke-width':1.5 }));

    for(let i=0;i<5;i++){
      const frac = (i+0.5)/5;
      const startY = topYAt(NUT_X) + frac*(bottomYAt(NUT_X)-topYAt(NUT_X));
      const endY = topYAt(RIGHT_EDGE) + frac*(bottomYAt(RIGHT_EDGE)-topYAt(RIGHT_EDGE));
      const midX = (NUT_X+RIGHT_EDGE)/2, midY = (startY+endY)/2 + (i%2?4:-4);
      svg.appendChild(svgEl('path', {
        d:`M ${NUT_X} ${startY} Q ${midX} ${midY} ${RIGHT_EDGE} ${endY}`,
        stroke:'rgba(90,60,20,0.08)', 'stroke-width':1, fill:'none'
      }));
    }

    const singleFrets = [3,5,7,9];
    singleFrets.forEach(f=>{
      svg.appendChild(svgEl('circle', { cx:cellCenterX(f), cy:centerY, r:7, fill:'#161616', stroke:'#000', 'stroke-width':0.5 }));
    });
    const x12 = cellCenterX(12);
    const dot12Offset = STRING_GAP*1.35 * (halfWidthAt(x12)/nutHalf);
    [centerY-dot12Offset, centerY+dot12Offset].forEach(y=>{
      svg.appendChild(svgEl('circle', { cx:x12, cy:y, r:7, fill:'#161616', stroke:'#000', 'stroke-width':0.5 }));
    });

    for(let f=1; f<=12; f++){
      const x = fretWireX(f);
      svg.appendChild(svgEl('line', { x1:x, y1:topYAt(x)-2, x2:x, y2:bottomYAt(x)+2, stroke:'#cfcfd3', 'stroke-width':3 }));
      svg.appendChild(svgEl('line', { x1:x, y1:topYAt(x)-2, x2:x, y2:bottomYAt(x)+2, stroke:'#ffffff', 'stroke-width':1, opacity:0.55 }));
    }

    svg.appendChild(svgEl('rect', {
      x:NUT_X-4, y:neckTop-2, width:8, height:(neckBottom-neckTop)+4, rx:2,
      fill:'#f2ede0', stroke:'#c3bb9f', 'stroke-width':1
    }));

    for(let row=0; row<n && !narrow; row++){
      const s = n-1-row;
      const t = 0.12 + row*(0.76/(n-1));
      const pegX = NUT_X + t*(HEAD_TIP_X-NUT_X);
      const edgeY = neckTop + t*(topHeadY-neckTop);
      const btnY = edgeY - PEG_POST_LEN;
      const stringY = stringYAt(row, NUT_X);
      const thickness = 1.4 + row*0.55;
      svg.appendChild(svgEl('line', { x1:NUT_X, y1:stringY, x2:pegX, y2:edgeY, stroke:'#333', 'stroke-width':thickness }));
      svg.appendChild(svgEl('line', { x1:NUT_X, y1:stringY, x2:pegX, y2:edgeY, stroke:'#eee', 'stroke-width':thickness*0.4, opacity:0.6 }));
      svg.appendChild(svgEl('line', { x1:pegX, y1:edgeY, x2:pegX, y2:btnY, stroke:'#8a8a8e', 'stroke-width':3 }));
      svg.appendChild(svgEl('circle', { cx:pegX, cy:btnY, r:PEG_R, fill:'url(#chordPegGrad)', stroke:'#3a3a3e', 'stroke-width':1 }));
    }

    for(let row=0; row<n; row++){
      const y1 = stringYAt(row, NUT_X), y2 = stringYAt(row, RIGHT_EDGE);
      const thickness = 1.4 + row*0.55;
      svg.appendChild(svgEl('line', { x1:NUT_X, y1, x2:RIGHT_EDGE, y2, stroke:'#333', 'stroke-width':thickness, 'stroke-linecap':'round' }));
      svg.appendChild(svgEl('line', { x1:NUT_X, y1, x2:RIGHT_EDGE, y2, stroke:'#eee', 'stroke-width':thickness*0.4, 'stroke-linecap':'round', opacity:0.6 }));
    }

    for(let f=0; f<=12; f++){
      const x = cellCenterX(f);
      const t = svgEl('text', { class:'fret-num', x, y:bottomYAt(x)+20 });
      t.textContent = f;
      svg.appendChild(t);
    }

    function yOf(s, x){ return stringYAt(n-1-s, x); }

    // tap targets + marks
    for(let s=0; s<n; s++){
      for(let f=0; f<=12; f++){
        const x = cellCenterX(f), y = yOf(s, x);
        const isMarked = marks[s] === f;
        const pc = pitchAt(s, f);
        const color = PITCH_COLORS[pc];
        const circle = svgEl('circle', {
          cx:x, cy:y, r:13,
          fill: isMarked ? color.fill : 'rgba(255,255,255,0.2)',
          stroke: isMarked ? color.stroke : 'rgba(255,255,255,0.85)',
          'stroke-width': isMarked ? 1.5 : 1.2,
          style: 'cursor:pointer;'
        });
        circle.addEventListener('click', ()=> onTapChordPosition(s, f));
        svg.appendChild(circle);
        if(isMarked){
          const label = svgEl('text', { x, y:y+4, 'text-anchor':'middle', 'font-size':10, 'font-weight':'bold', fill:'#1a1a1a' });
          label.textContent = pc;
          label.style.pointerEvents = 'none';
          svg.appendChild(label);
        }
      }
    }
  }

  render();
  window.matchMedia('(max-width: 600px)').addEventListener('change', render);
})();
</script>
<script>
(function(){
  "use strict";
  // キー → カポなし時のダイアトニックコード（I, IIm, IIIm, IV, V, VIm, VIIdim）
  const OPEN = {
    'F':['F','Gm','Am','B♭','C','Dm','Edim'],
    'E':['E','F#m','G#m','A','B','C#m','D#dim'],
    'E♭':['E♭','Fm','Gm','A♭','B♭','Cm','Ddim'],
    'D':['D','Em','F#m','G','A','Bm','C#dim'],
    'D♭':['D♭','E♭m','Fm','G♭','A♭','B♭m','Cdim'],
    'C':['C','Dm','Em','F','G','Am','Bdim'],
    'B':['B','C#m','D#m','E','F#','G#m','A#dim'],
    'B♭':['B♭','Cm','Dm','E♭','F','Gm','Adim'],
    'A':['A','Bm','C#m','D','E','F#m','G#dim'],
    'A♭':['A♭','B♭m','Cm','D♭','E♭','Fm','Gdim'],
    'G':['G','Am','Bm','C','D','Em','F#dim'],
    'G♭':['G♭','A♭m','B♭m','B','D♭','E♭m','Fdim']
  };
  const SEMI = {'F':5,'E':4,'E♭':3,'D':2,'D♭':1,'C':0,'B':11,'B♭':10,'A':9,'A♭':8,'G':7,'G♭':6};
  const SHAPES = ['C','A','G','E','D'];   // 押さえやすいオープンコードのキー
  const SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const SHAPE_ST = [0,2,4,5,7,9,11];
  const SHAPE_Q = ['','m','m','','','m','dim'];
  function shapeRow(shape){
    const r = SEMI[shape];
    return SHAPE_ST.map((st,i)=> SHARP[(r+st)%12] + SHAPE_Q[i]);
  }
  const capoTable = document.getElementById('capoTable');
  const capoKeys = document.getElementById('capoKeys');
  const KEYS = Object.keys(OPEN);
  let curKey = 'C';
  try{ const k = localStorage.getItem('capoKey'); if(k && OPEN[k]) curKey = k; }catch(e){}
  function renderCapo(){
    capoKeys.querySelectorAll('button').forEach(b=> b.classList.toggle('active', b.dataset.key===curKey));
    const rows = [{pos:'カポなし', chords:OPEN[curKey]}];
    for(let c=1;c<=5;c++){
      const shape = SHAPES.find(sh => (SEMI[sh]+c)%12 === SEMI[curKey]);
      if(shape) rows.push({pos:'capo'+c, chords:shapeRow(shape)});
    }
    let h = '<thead><tr><th>カポ</th><th>Ⅰ</th><th>Ⅱm</th><th>Ⅲm</th><th>Ⅳ</th><th>Ⅴ</th><th>Ⅵm</th><th>Ⅶdim</th></tr></thead><tbody>';
    rows.forEach(row=>{
      h += '<tr><td class="capo-pos">'+row.pos+'</td>';
      row.chords.forEach(c=>{ h += '<td>'+c+'</td>'; });
      h += '</tr>';
    });
    capoTable.innerHTML = h + '</tbody>';
  }
  capoKeys.innerHTML = KEYS.map(k=>'<button type="button" data-key="'+k+'">'+k+'</button>').join('');
  capoKeys.addEventListener('click', e=>{
    const b = e.target.closest('button[data-key]');
    if(!b) return;
    curKey = b.dataset.key;
    try{ localStorage.setItem('capoKey', curKey); }catch(e){}
    renderCapo();
  });
  renderCapo();
})();
</script>
